# Agent-layer composition patch: route dsh's LLM through the local llm-gateway
# (OpenAI-compatible bridge over z-ai-web-dev-sdk) and widen the bash timeout.
- id: llm-pi-ai
  config:
    providers:
      zai-gateway:
        apiKeyEnv: ZAI_GATEWAY_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:3021/v1
        compat:
          supportsDeveloperRole: false
          supportsUsageInStreaming: false
          maxTokensField: max_tokens
        models:
          - id: glm-4-plus
            contextWindow: 131072
            maxTokens: 8192
            input: [text]

- id: agent-default-model
  config:
    provider: zai-gateway
    model: glm-4-plus

- id: bash-sandbox
  config:
    timeoutMs: 600000

# This host has no bwrap/landlock sandbox backend — run commands directly.
- id: sandbox-policy
  config:
    mode: danger-full-access
- id: approval
  config:
    policy: never
