# deepseek-harness settings for the dashboard's agent layer.
# LLM provider routes through the local llm-gateway (OpenAI-compatible
# bridge over z-ai-web-dev-sdk) — no external API key required.

llm-pi-ai:
  providers:
    zai-gateway:
      apiKeyEnv: ZAI_GATEWAY_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:3021/v1
      compat:
        supportsDeveloperRole: false
        supportsUsageInStreaming: false
        maxTokensField: max_tokens
        supportsTemperature: true
        supportsStrictTools: false
      models:
        - id: glm-4-plus
          contextWindow: 131072
          maxTokens: 8192
          input: [text]

agent-default-model:
  provider: zai-gateway
  model: glm-4-plus
