<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Web Dashboard favicon — same mark as the header logo: a dashboard
       layout glyph (sidebar + two content panes) on an emerald gradient. -->
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <rect x="12" y="12" width="14" height="40" rx="4" fill="#ffffff"/>
  <rect x="32" y="12" width="20" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="32" y="35" width="20" height="17" rx="4" fill="#ffffff" fill-opacity="0.8"/>
</svg>
